name: Attendance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m py_compile attendance.py
      - name: Upload attendance file
        uses: actions/upload-artifact@v4
        with:
          name: attendance-file
          path: attendance.py
          retention-days: 1
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download attendance file
        uses: actions/download-artifact@v4
        with:
          name: attendance-file
      - name: Test attendance
        run: |
          result=$(python attendance.py 100 10)
          echo "Got: $result"
          [ "$result" = "90" ]
